# Application
server.port=${SERVER_PORT:8080}
spring.application.name=quick-start

# ============================================================================
# Database Configuration
# ============================================================================
spring.datasource.url=jdbc:h2:mem:security_db;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Execute SQL scripts on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Logging
logging.level.com.original.security=DEBUG
logging.level.com.example.quickstart=DEBUG

# ============================================================================
# Security Boot Configuration
# ============================================================================
security.jwt.secret=example-quick-start-very-long-secret-key-for-jwt-2026

# CORS
security.network.cors.enabled=true
security.network.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# CSRF (Disable for REST API/Frontend separation)
security.network.csrf.enabled=false
